site_name: BootCamp - Visão Computacional + IA na prática
site_url: https://marcostavar3s.github.io/semanaC-T/
theme:
    name: simple-blog
    features:
      - content.code.copy

nav:
  - Início: index.md
  - Material: 
    - Fundamentos de imagens digitais: dia01.md
    - Modelos de Visão Computacional: dia02.md
    - Agentes + Visão Computacional: dia03.md
  - Contatos: contatos.md
    
plugins:
  - awesome-pages

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  
markdown_extensions:
  - attr_list
  - tables
  - fenced_code
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

copyright: 'Desenvolvido por Marcos Aurélio Tavares Filho.'